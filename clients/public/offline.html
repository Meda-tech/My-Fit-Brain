<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#145A5A" />
    <title>My Fit Brain</title>
    <style>
      /* Static fallback page: colours mirror styles/mfb-tokens.css (no stylesheet available offline). */
      :root { --teal: #145A5A; --cream: #FBF7F2; --ink-soft: #3D5050; --coral-deep: #B9502F; --sand: #E6DED3; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--cream); }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        font-family: Arial, sans-serif; color: var(--ink-soft); text-align: center;
      }
      img { width: 64px; height: 64px; }
      h1 { margin: 24px 0 8px; color: var(--teal); font-size: 26px; line-height: 1.25; }
      p { margin: 0 0 4px; font-size: 16px; line-height: 1.5; max-width: 320px; }
      .hi { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--sand); }
      button {
        margin-top: 28px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
        background: var(--coral-deep); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/brand/logo/MFB_Icon_FullColour.svg" alt="My Fit Brain" />
    <h1>You're offline</h1>
    <p>Check your internet connection and try again.</p>
    <div class="hi" lang="hi">
      <p>आप ऑफ़लाइन हैं। अपना इंटरनेट कनेक्शन जांचें और फिर से कोशिश करें।</p>
    </div>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
